<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2310151b' stroke='%23f08a3c' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='none' stroke='%238fd0e6' stroke-width='4'/%3E%3C/svg%3E" rel="icon"/>

<style>
  :root {
    --base: #10151b;
    --panel: #171e26;
    --line: #2a333e;
    --bone: #ebe5d6;
    --ash: #8d96a0;
    --magma: #f08a3c;
    --frost: #8fd0e6;

    --acc: #c9c4b6;
    --acc-rgb: 201, 196, 182;

    --display: "Forum", "Trajan Pro", Georgia, serif;
    --body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;

    --pad: clamp(20px, 5vw, 56px);
    --max: 1180px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    margin: 0; background: var(--base); color: var(--bone);
    font-family: var(--body); font-size: 17px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--frost); outline-offset: 3px; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Header ---------- */
  .site-head {
    position: fixed; inset: 0 0 auto 0; z-index: 30;
    background: rgba(16, 21, 27, 0.82);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .site-head .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { font-family: var(--display); font-size: 22px; letter-spacing: 0.14em; text-decoration: none; white-space: nowrap; }
  .site-nav { display: flex; align-items: center; gap: 28px; }
  .site-nav a { text-decoration: none; color: var(--ash); font-size: 15px; transition: color .2s; }
  .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--bone); }
  .site-nav .nav-play { color: var(--base); background: var(--magma); padding: 8px 16px; border-radius: 4px; font-weight: 600; }
  .site-nav .nav-play:hover { color: var(--base); background: #f59a52; }

  main { min-height: 100vh; padding-top: 64px; }

  /* ---------- Common ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 15px/1 var(--body); padding: 14px 24px; border-radius: 4px;
    border: 1px solid var(--acc); color: var(--bone); background: transparent;
    text-decoration: none; cursor: pointer; transition: background .2s;
  }
  .btn:hover { background: rgba(var(--acc-rgb), 0.14); }

  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ash); white-space: nowrap; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ash); }
  .status.ready::before { background: var(--frost); }
  .status.wip::before { background: var(--magma); }

  /* ---------- Catalog ---------- */
  .c-head { padding-top: clamp(48px, 8vw, 96px); padding-bottom: 40px; }
  .c-head h1 {
    font-family: var(--display); font-weight: 400; text-transform: uppercase;
    font-size: clamp(56px, 10vw, 128px); line-height: 0.95; letter-spacing: 0.02em;
  }
  .c-head p { margin-top: 22px; max-width: 52ch; color: var(--ash); font-size: 19px; }

  .c-tools { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; padding-bottom: 32px; }
  .search {
    flex: 1 1 280px; max-width: 420px; padding: 13px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; color: var(--bone);
    font: 400 16px var(--body);
  }
  .search::placeholder { color: var(--ash); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px; background: transparent; border: 1px solid var(--line); border-radius: 4px;
    color: var(--ash); cursor: pointer; font-size: 15px; transition: border-color .2s, color .2s, background .2s;
  }
  .chip:hover { color: var(--bone); border-color: var(--ash); }
  .chip[aria-pressed="true"] { color: var(--base); background: var(--bone); border-color: var(--bone); }
  .count { color: var(--ash); font-size: 14px; padding-bottom: 12px; }

  .feature {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    align-items: center; gap: clamp(16px, 4vw, 48px);
    margin-bottom: 40px; padding: clamp(24px, 4vw, 48px);
    border: 1px solid var(--line); text-decoration: none; overflow: hidden;
    background:
      radial-gradient(380px circle at var(--mx, 85%) var(--my, 50%), rgba(var(--acc-rgb), 0.22), transparent 70%),
      radial-gradient(70% 90% at 80% 50%, rgba(var(--acc-rgb), 0.16), transparent 70%),
      var(--panel);
    transition: border-color .25s;
  }
  .feature:hover { border-color: var(--acc); }
  .feature h2 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 6vw, 80px); line-height: 1; text-transform: uppercase; }
  .feature .f-type { margin-top: 12px; color: var(--acc); font-family: var(--display); font-size: 22px; }
  .feature .f-tag { margin-top: 16px; color: var(--ash); max-width: 36ch; }
  .feature .f-go { margin-top: 28px; }
  .feature img { width: 100%; max-width: 520px; justify-self: center; transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
  .feature:hover img { transform: scale(1.03) rotate(-1.5deg); }

  .ledger { border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: 72px minmax(0, 1.1fr) minmax(0, 1.4fr) auto;
    align-items: center; gap: 24px; padding: 18px 0;
    border-bottom: 1px solid var(--line); text-decoration: none; transition: background .2s;
  }
  .row:hover { background: rgba(235, 229, 214, 0.03); }
  .thumb {
    width: 72px; height: 72px; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--line); overflow: hidden;
    font-family: var(--display); font-size: 30px; color: var(--acc);
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
  .row .r-name { font-family: var(--display); font-size: clamp(24px, 3vw, 32px); line-height: 1.1; }
  .row .r-type { margin-top: 4px; color: var(--ash); font-size: 14px; }
  .row .r-tag { color: var(--ash); }

  .empty { padding: 40px 0; color: var(--ash); }

  .queue { margin-top: clamp(56px, 8vw, 96px); padding-bottom: clamp(56px, 8vw, 96px); }
  .queue h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 4vw, 40px); }
  .queue p { margin-top: 10px; color: var(--ash); max-width: 52ch; }
  .queue ul { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); column-gap: 48px; border-top: 1px solid var(--line); }
  .queue li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .queue .q-cat { color: var(--ash); font-size: 14px; }

  /* ---------- Entry hero ---------- */
  .e-hero {
    position: relative; overflow: hidden; display: flex; align-items: center;
    min-height: min(calc(100svh - 64px), 900px); padding: 56px 0 48px;
    background:
      radial-gradient(60% 75% at 74% 48%, rgba(var(--acc-rgb), 0.2), transparent 72%),
      var(--base);
  }
  .e-hero.no-art { min-height: 0; padding: clamp(64px, 10vw, 128px) 0 clamp(40px, 6vw, 72px); }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .e-stage { position: relative; z-index: 1; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
  .e-title {
    grid-area: 1 / 1; align-self: start; z-index: 1;
    font-family: var(--display); font-weight: 400; text-transform: uppercase;
    font-size: clamp(40px, 8vw, 124px); line-height: 0.9; letter-spacing: 0.01em;
  }
  .e-art { grid-area: 1 / 1; justify-self: end; align-self: center; z-index: 2; width: min(62%, 740px); margin-top: clamp(24px, 6vw, 72px); perspective: 1100px; }
  .art-in {
    position: relative;
    transform: translate3d(0, calc(var(--sy, 0) * -0.09px), 0) rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg));
    will-change: transform;
  }
  .art-in img { width: 100%; height: auto; filter: drop-shadow(0 30px 38px rgba(0, 0, 0, 0.6)); }
  /* Свет за курсором ложится только на само оружие: маской служит альфа-канал картинки */
  .lit {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: var(--lo, 0);
    background: radial-gradient(circle at var(--mx, 70%) var(--my, 35%), rgba(255, 226, 176, 0.7), rgba(255, 190, 110, 0.22) 28%, transparent 46%);
    -webkit-mask: var(--img) center / contain no-repeat; mask: var(--img) center / contain no-repeat;
    transition: opacity .4s;
  }
  .e-title { transform: translate3d(0, calc(var(--sy, 0) * 0.05px), 0); }
  .e-title .ch {
    display: inline-block;
    background: linear-gradient(180deg, #f6f1e4 8%, #b9ad95 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .e-title .sp { display: inline-block; width: 0.3em; }
  .rings {
    position: absolute; left: 70%; top: 52%; width: min(130vw, 1300px); aspect-ratio: 1; z-index: 0; pointer-events: none;
    transform: translate(-50%, -50%) rotate(calc(var(--sy, 0) * 0.05deg + var(--rr, 0deg)));
  }
  .rings * { fill: none; }
  .rings .a { stroke: rgba(var(--acc-rgb), 0.26); stroke-width: 1; }
  .rings .b { stroke: rgba(235, 229, 214, 0.15); stroke-width: 1.4; stroke-linecap: round; }
  .e-hero::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 50%, rgba(5, 8, 11, 0.55)); }
  .e-hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 32%; z-index: 0; pointer-events: none; background: linear-gradient(to top, rgba(var(--acc-rgb), 0.12), transparent); }
  .c-banner { position: relative; overflow: hidden; }
  .c-banner .rings { left: 88%; top: 48%; width: 900px; opacity: 0.8; transform: translate(-50%, -50%); }
  .c-banner::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45%; z-index: 0; pointer-events: none; background: linear-gradient(to bottom, transparent, var(--base)); }
  .c-banner .c-head { position: relative; z-index: 1; }
  .e-meta { grid-area: 1 / 1; align-self: end; z-index: 3; max-width: 380px; }
  .no-art .e-meta { grid-area: auto; margin-top: 32px; }
  .crumb { font-size: 14px; color: var(--ash); }
  .crumb a { text-decoration: none; }
  .crumb a:hover { color: var(--bone); }
  .e-tag { margin-top: 14px; font-family: var(--display); font-size: clamp(24px, 2.6vw, 32px); line-height: 1.2; }
  .facts { margin-top: 22px; border-top: 1px solid var(--line); }
  .facts div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .facts dt { color: var(--ash); }
  .facts dd { margin: 0; }

  /* ---------- Entry body ---------- */
  .e-sec { position: relative; padding: clamp(56px, 8vw, 104px) 0; }
  .e-sec::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, var(--acc), var(--line) 40%); }
  .e-sec h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(32px, 4.8vw, 56px); line-height: 1; margin-bottom: 28px; }
  .prose { max-width: 62ch; }
  .prose p + p { margin-top: 18px; }
  .prose p { font-size: 18px; }

  .anat { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(24px, 5vw, 64px); align-items: start; }
  .anat-img {
    position: relative; border: 1px solid var(--line); padding: clamp(12px, 3vw, 32px);
    background: radial-gradient(70% 70% at 60% 40%, rgba(var(--acc-rgb), 0.14), transparent 75%), var(--panel);
  }
  .anat-view { position: relative; overflow: hidden; }
  .zoom { position: relative; transform-origin: 0 0; transform: translate(var(--tx, 0%), var(--ty, 0%)) scale(var(--zs, 1)); transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
  .zoom img { width: 100%; height: auto; }
  .zoom-reset { position: absolute; right: 0; top: 0; z-index: 3; padding: 8px 12px; font-size: 13px; background: rgba(16, 21, 27, 0.88); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  .zoom-reset:hover { border-color: var(--ash); }
  .hot {
    position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; padding: 0;
    border: 2px solid var(--bone); border-radius: 50%; background: rgba(16, 21, 27, 0.55);
    cursor: pointer; transform: scale(calc(1 / var(--zs, 1))); transition: transform .2s, background .2s, border-color .2s;
  }
  .hot::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: transparent; transition: background .2s; }
  .hot:hover { transform: scale(calc(1.12 / var(--zs, 1))); }
  .hot[aria-pressed="true"] { border-color: var(--frost); background: rgba(16, 21, 27, 0.85); }
  .hot[aria-pressed="true"]::after { background: var(--frost); }

  .parts { border-top: 1px solid var(--line); }
  .part { border-bottom: 1px solid var(--line); }
  .part button { display: block; width: 100%; text-align: left; padding: 16px 0; background: none; border: 0; cursor: pointer; }
  .part .p-name { font-family: var(--display); font-size: clamp(22px, 2.6vw, 28px); line-height: 1.2; color: var(--ash); transition: color .2s; }
  .part button:hover .p-name { color: var(--bone); }
  .part .p-text { display: none; margin-top: 8px; color: var(--ash); max-width: 46ch; }
  .part.on .p-name { color: var(--bone); }
  .part.on .p-text { display: block; }

  .stat-table { width: 100%; max-width: 640px; border-collapse: collapse; }
  .stat-table th, .stat-table td { text-align: left; padding: 14px 0; border-bottom: 1px solid var(--line); font-weight: 400; }
  .stat-table th { color: var(--ash); }
  .stat-table td { font-family: var(--display); font-size: 26px; }
  .stat-note { max-width: 52ch; padding: 20px 24px; border: 1px solid var(--line); color: var(--ash); }

  .see ul { border-top: 1px solid var(--line); max-width: 640px; }
  .see a { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: color .2s; }
  .see a:hover .s-name { color: var(--acc); }
  .see .s-name { font-family: var(--display); font-size: 26px; transition: color .2s; }
  .see .s-cat { color: var(--ash); align-self: center; font-size: 14px; }

  .back { padding: 40px 0 96px; }

  /* ---------- Footer ---------- */
  .site-foot { border-top: 1px solid var(--line); padding: 32px 0 40px; color: var(--ash); font-size: 14px; }
  .site-foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

  /* ---------- Entry load: one calm sequence ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes forge { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes cool {
    from { filter: brightness(2.4) saturate(0.6) drop-shadow(0 30px 38px rgba(0, 0, 0, 0.6)); }
    to   { filter: brightness(1) saturate(1) drop-shadow(0 30px 38px rgba(0, 0, 0, 0.6)); }
  }
  .e-title .ch { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 45ms + 60ms); }
  .e-art { animation: forge 1.1s cubic-bezier(.2, .7, .2, 1) .25s both; }
  .art-in img { animation: cool 1.6s ease-out .25s both; }
  .e-meta { animation: rise .8s cubic-bezier(.2, .7, .2, 1) .6s both; }

  /* ---------- Responsive ---------- */
  @media (max-width: 880px) {
    .feature { grid-template-columns: 1fr; }
    .row { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; }
    .row .r-tag { display: none; }
    .thumb { width: 64px; height: 64px; }
    .e-stage { display: flex; flex-direction: column; gap: 8px; }
    .e-art { width: 100%; margin-top: 0; order: 2; }
    .e-meta { order: 3; max-width: none; margin-top: 16px; }
    .anat { grid-template-columns: 1fr; }
    .rings { left: 62%; width: 170vw; }
    .site-nav a:not(.nav-play):not([data-keep]) { display: none; }
  }

  @media (max-width: 560px) {
    .brand { font-size: 18px; letter-spacing: 0.1em; }
    .site-nav { gap: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
/*
  База вики VAULT ZERO.

  Как добавить запись: скопируй любой блок внутри entries, поменяй id (латиницей, без пробелов)
  и тексты. Страница появится в каталоге сама, адрес будет wiki.html#/твой-id.

  image    - имя файла картинки рядом с wiki.html (пусто, если картинки пока нет)
  accent   - цвет страницы: "magma", "frost" или "bone"
  status   - "ready" (готово), "wip" (в разработке) или "draft" (черновик)
  stats    - характеристики, пустой список скрывает цифры и показывает пометку
  parts    - точки на схеме. x и y в процентах от картинки (0-100)
  lore     - абзацы истории, пустой список скрывает раздел
  related  - id других записей для блока "Смотрите также"
*/
window.WIKI = {
  categories: [
    { id: "weapon", name: "Оружие" },
    { id: "mob", name: "Мобы" },
    { id: "npc", name: "Жители" }
  ],

  statuses: { ready: "Готово", wip: "В разработке", draft: "Черновик" },

  entries: [
    {
      id: "corebreaker",
      name: "Corebreaker",
      category: "weapon",
      type: "Боевая секира",
      accent: "magma",
      status: "wip",
      featured: true,
      tagline: "Секира с живым магматическим ядром.",
      image: "corebreaker.webp",
      facts: [
        ["Тип", "Боевая секира"],
        ["Стихия", "Магма"],
        ["Статус", "В разработке"]
      ],
      description: [
        "Corebreaker — боевая секира с широким лезвием-полумесяцем и острыми гранями с обеих сторон. Тёмный камень корпуса пронизан трещинами раскалённой магмы, которая сходится к центру оружия.",
        "Передняя и задняя части соединены в единую конструкцию. Рукоять гранёная, с кольцами, а навершие закрывают шипы и красный кристалл."
      ],
      parts: [
        { id: "blade", name: "Лезвие-полумесяц", x: 89.8, y: 38.2,
          text: "Самая крупная деталь. Раскалённая кромка по внешнему краю и сетка трещин внутри." },
        { id: "core", name: "Магматическое ядро", x: 68.3, y: 34.1,

(function(){

  D.statuses.ready='Арт готов';D.statuses.wip='В процессе';
  window.VZ_ITEMS.forEach(function(it){

    var extra=[['Vault',v.name],['Редкость',it.rarity],['Статус арта',actual]];
    if(old){

      old.facts=(old.facts||[]).filter(function(f){return f[0]!=='Статус'}).concat(extra);
      old.type=old.type||'Оружие';
      old.related=(old.related||[]).filter(function(id){return id!=='shatterheart'||it.id!=='corebreaker'});
    }else{
      D.entries.push({id:it.id,name:it.name,category:'weapon',type:'Оружие',status:it.status,accent:it.vault==='magma'||it.vault==='royal'?'magma':it.vault==='ice'||it.vault==='diamond'?'frost':'bone',vault:it.vault,rarity:it.rarity,preview:it.preview,image:it.image,
        tagline:v.name+' · '+it.rarity,

        description:[it.status==='ready'?'Изображение этого предмета готово и включено в коллекцию '+v.name+'.':'Концепт этого предмета находится в разработке для '+v.name+'.', 'Боевые параметры, способы получения и присутствие в опубликованной игре по представленным изображениям не подтверждены.'],
        parts:[],stats:[],lore:[],related:[]});
    }
  });
  D.entries.forEach(function(e){if(!e.vault)return;var a=D.entries.filter(function(x){return x.vault===e.vault && x.id!==e.id});e.related=a.slice(0,3).map(function(x){return x.id})});
})();

<script>
(function () {
  "use strict";

  var DATA = window.WIKI || { categories: [], statuses: {}, entries: [], queue: [] };
  var view = document.getElementById("view");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var ACCENTS = {
    magma: ["#f08a3c", "240, 138, 60"],
    frost: ["#8fd0e6", "143, 208, 230"],
    bone:  ["#c9c4b6", "201, 196, 182"]
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function catName(id) {
    for (var i = 0; i < DATA.categories.length; i++) if (DATA.categories[i].id === id) return DATA.categories[i].name;
    return "";
  }
  function byId(id) {
    for (var i = 0; i < DATA.entries.length; i++) if (DATA.entries[i].id === id) return DATA.entries[i];
    return null;
  }
  function setAccent(el, name) {
    var a = ACCENTS[name] || ACCENTS.bone;
    el.style.setProperty("--acc", a[0]);
    el.style.setProperty("--acc-rgb", a[1]);
  }
  function statusHtml(s) {
    return '<span class="status ' + esc(s) + '">' + esc(DATA.statuses[s] || s) + "</span>";
  }

  /* ---------- Анимация фона (угли или ледяная пыль) ---------- */
  var loopId = 0, loopAlive = false;
  var scrollFn = null;
  function stopLoop() {
    loopAlive = false; if (loopId) cancelAnimationFrame(loopId); loopId = 0;
    if (scrollFn) { window.removeEventListener("scroll", scrollFn); scrollFn = null; }
  }

  function titleHtml(name) {
    var out = '<h1 class="e-title" aria-label="' + esc(name) + '">', n = 0;
    for (var k = 0; k < name.length; k++) {
      var c = name.charAt(k);
      if (c === " ") out += '<span class="sp" aria-hidden="true"> </span>';
      else out += '<span class="ch" aria-hidden="true" style="--i:' + (n++) + '">' + esc(c) + "</span>";
    }
    return out + "</h1>";
  }

  function ringsSvg() {
    var s = '<svg class="rings" viewBox="0 0 500 500" aria-hidden="true">';
    s += '<circle class="a" cx="250" cy="250" r="240"/><circle class="a" cx="250" cy="250" r="214"/><circle class="a" cx="250" cy="250" r="168"/><circle class="a" cx="250" cy="250" r="120"/>';
    for (var i = 0; i < 72; i++) s += '<line class="b" x1="250" y1="12" x2="250" y2="' + (i % 6 ? 17 : 24) + '" transform="rotate(' + i * 5 + ' 250 250)"/>';
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var r = 0; r < 48; r++) {
      var d = "M250 44 L250 64", q = rnd();
      if (q < 0.33) d += " M250 54 L258 46"; else if (q < 0.66) d += " M250 58 L242 50"; else d += " M245 50 L255 50";
      s += '<path class="b" d="' + d + '" transform="rotate(' + r * 7.5 + ' 250 250)"/>';
    }
    return s + "</svg>";
  }

  function startHeroLoop(hero, art, accent) {
    stopLoop();
    if (reduce) return;
    var cv = hero.querySelector("#fx");
    var ctx = cv.getContext("2d");
    var W = 0, H = 0, motes = [];
    var kind = accent === "magma" ? "ember" : accent === "frost" ? "frost" : "dust";
    var rgb = kind === "ember" ? "255,150,60" : kind === "frost" ? "170,225,245" : "225,215,195";
    var up = kind === "ember";

    function spawn(initial, near) {
      return {
        near: near,
        x: W * (0.3 + Math.random() * 0.7), y: initial ? Math.random() * H : (up ? H + 12 : -12),
        vx: (Math.random() - 0.5) * (near ? 0.35 : 0.2),
        vy: (up ? -1 : 1) * (near ? 0.5 + Math.random() * 0.8 : 0.18 + Math.random() * 0.3),
        r: near ? 1.2 + Math.random() * 1.6 : 0.5 + Math.random() * 0.9,
        a: near ? 0.55 + Math.random() * 0.35 : 0.2 + Math.random() * 0.25,
        ph: Math.random() * 6.28
      };
    }
    function size() {
      var r = hero.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      motes = [];
      for (var i = 0; i < 16; i++) motes.push(spawn(true, false));
      for (var j = 0; j < 9; j++) motes.push(spawn(true, true));
    }
    size();
    window.addEventListener("resize", size, { passive: true });

    var tgt = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
    hero.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      var r = hero.getBoundingClientRect();
      tgt.x = (e.clientX - r.left) / r.width - 0.5;
      tgt.y = (e.clientY - r.top) / r.height - 0.5;
      if (art) {
        var ar = art.getBoundingClientRect();
        art.style.setProperty("--mx", ((e.clientX - ar.left) / ar.width * 100).toFixed(1) + "%");
        art.style.setProperty("--my", ((e.clientY - ar.top) / ar.height * 100).toFixed(1) + "%");
        art.style.setProperty("--lo", 1);
      }
    });
    hero.addEventListener("pointerleave", function () {
      tgt.x = 0; tgt.y = 0;
      if (art) art.style.setProperty("--lo", 0);
    });

    scrollFn = function () { hero.style.setProperty("--sy", Math.min(window.scrollY, 1000)); };
    window.addEventListener("scroll", scrollFn, { passive: true });
    scrollFn();

    loopAlive = true;
    (function frame() {
      if (!loopAlive || !cv.isConnected) { window.removeEventListener("resize", size); return; }
      var t = performance.now();
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < motes.length; i++) {
        var m = motes[i];
        m.x += m.vx + Math.sin(t * 0.0015 + m.ph) * 0.18; m.y += m.vy;
        if (m.y < -14 || m.y > H + 14) { motes[i] = spawn(false, m.near); continue; }
        var fl = 0.75 + 0.25 * Math.sin(t * 0.006 + m.ph * 3);
        ctx.shadowBlur = m.near ? 8 : 0; ctx.shadowColor = "rgba(" + rgb + ",0.9)";
        ctx.globalAlpha = m.a * fl; ctx.fillStyle = "rgb(" + rgb + ")";
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      cur.x += (tgt.x - cur.x) * 0.07; cur.y += (tgt.y - cur.y) * 0.07;
      if (art) {
        art.style.setProperty("--ry", (cur.x * 7).toFixed(2) + "deg");
        art.style.setProperty("--rx", (-cur.y * 5).toFixed(2) + "deg");
      }
      hero.style.setProperty("--rr", (cur.x * 5).toFixed(2) + "deg");
      loopId = requestAnimationFrame(frame);
    })();
  }

  /* ---------- Каталог ---------- */
  function renderCatalog() {
    stopLoop();
    document.title = "Вики — VAULT ZERO";
    var cats = DATA.categories.filter(function (c) {
      return DATA.entries.some(function (e) { return e.category === c.id; });
    });

    view.innerHTML =
      '<div class="c-banner">' + ringsSvg() +
      '<section class="wrap c-head">' +
        "<h1>Вики</h1>" +
        "<p>Архив 48 предметов из восьми хранилищ, а также мобы и жители VAULT ZERO. Статус относится к готовности изображения.</p>" +
      "</section></div>" +
      '<div class="wrap">' +
        '<div class="c-tools">' +
          '<label class="sr" for="q">Поиск по вики</label>' +
          '<input class="search" id="q" type="search" placeholder="Найти запись" autocomplete="off">' +
          '<div class="chips" id="chips"></div>' +
          '<label class="sr" for="wikiVault">Vault</label><select class="archive-select" id="wikiVault"><option value="all">Все Vault</option>'+window.VZ_VAULTS.map(function(v){return '<option value="'+v.id+'">'+v.name+'</option>'}).join('')+'</select>' +
          '<label class="sr" for="wikiStatus">Статус</label><select class="archive-select" id="wikiStatus"><option value="all">Любой статус</option><option value="ready">Арт готов</option><option value="wip">В процессе</option></select>' +
        "</div>" +
        '<p class="count" id="count" aria-live="polite"></p>' +
        '<div id="results"></div>' +
        '<section class="queue" id="queue"></section>' +
      "</div>";

    var state = { q: "", cat: "all", vault:"all", status:"all" };
    var chipsEl = document.getElementById("chips");
    var chipDefs = [{ id: "all", name: "Все" }].concat(cats);
    chipsEl.innerHTML = chipDefs.map(function (c) {
      return '<button class="chip" type="button" data-cat="' + esc(c.id) + '" aria-pressed="' + (c.id === "all") + '">' + esc(c.name) + "</button>";
    }).join("");

    function match(e) {
      if (state.cat !== "all" && e.category !== state.cat) return false;
      if(state.vault !== "all" && e.vault !== state.vault) return false;
      if(state.status !== "all" && e.status !== state.status) return false;
      if (!state.q) return true;
      var hay = [e.name, e.type, e.tagline, catName(e.category),e.vault||"",e.rarity||""].join(" ").toLowerCase();
      return hay.indexOf(state.q) !== -1;
    }

    function draw() {
      var list = DATA.entries.filter(match);
      var filtering = state.q || state.cat !== "all" || state.vault !== "all" || state.status !== "all";
      var html = "";
      var featured = !filtering && DATA.entries.filter(function (e) { return e.featured && e.image; })[0];
      if (featured) {
        html +=
          '<a class="feature" href="#/' + esc(featured.id) + '" data-acc="' + esc(featured.accent) + '">' +
            "<div>" +
              "<h2>" + esc(featured.name) + "</h2>" +
              '<p class="f-type">' + esc(featured.type) + "</p>" +
              '<p class="f-tag">' + esc(featured.tagline) + "</p>" +
              '<p class="f-go">' + statusHtml(featured.status) + "</p>" +
            "</div>" +
            '<img src="' + esc(featured.image) + '" alt="' + esc(featured.name) + '">' +
          "</a>";
      }
      var rows = list.filter(function(e){return !featured || e.id!==featured.id});
      var used={};
      window.VZ_VAULTS.forEach(function(v){
        var group=rows.filter(function(e){return e.vault===v.id});
        if(!group.length)return;
        group.sort(function(a,b){return (['Common','Uncommon','Rare','Epic','Legendary','Mythic','Secret'].indexOf(a.rarity))-(['Common','Uncommon','Rare','Epic','Legendary','Mythic','Secret'].indexOf(b.rarity))});
        html+='<section class="wiki-collection" style="--vault-color:'+v.color+'"><div class="wiki-collection-head"><div><small>'+esc(v.kicker)+'</small><h2>'+esc(v.name)+'</h2></div><a href="vaults.html#'+v.id+'">Всё хранилище ↗</a></div><div class="wiki-card-grid">';
        group.forEach(function(e){used[e.id]=true;html+='<a class="wiki-item-card" href="#/'+esc(e.id)+'"><div class="wiki-item-image"><img loading="lazy" src="'+esc(e.preview||e.image)+'" alt="'+esc(e.name)+'"></div><div class="wiki-item-info"><strong>'+esc(e.name)+'</strong><span>'+esc(e.rarity||'')+' · '+esc(DATA.statuses[e.status]||e.status)+'</span></div></a>'});
        html+='</div></section>';
      });
      var other=rows.filter(function(e){return !used[e.id]});
      if(other.length){
        html+='<section class="wiki-collection misc"><div class="wiki-collection-head"><div><small>WORLD ARCHIVE</small><h2>Мир VAULT ZERO</h2></div></div><div class="ledger">';
        html+=other.map(function(e){var a=ACCENTS[e.accent]||ACCENTS.bone;var thumb=e.image?'<img src="'+esc(e.image)+'" loading="lazy" alt="">':esc(e.name.charAt(0));return '<a class="row" href="#/'+esc(e.id)+'" style="--acc:'+a[0]+'"><span class="thumb">'+thumb+'</span><span><span class="r-name">'+esc(e.name)+'</span><p class="r-type">'+esc(catName(e.category))+'</p></span><span class="r-tag">'+esc(e.tagline)+'</span>'+statusHtml(e.status)+'</a>'}).join('')+'</div></section>';
      }
      if (!list.length) html = '<p class="empty">Ничего не найдено. Попробуй другое слово или сбрось фильтр.</p>';
      document.getElementById("results").innerHTML = html;
      Array.prototype.forEach.call(document.querySelectorAll(".feature"), function (el) { setAccent(el, el.getAttribute("data-acc")); });
      document.getElementById("count").textContent = "Записей: " + list.length;
    }

    chipsEl.addEventListener("click", function (ev) {
      var b = ev.target.closest(".chip"); if (!b) return;
      state.cat = b.getAttribute("data-cat");
      Array.prototype.forEach.call(chipsEl.children, function (c) { c.setAttribute("aria-pressed", String(c === b)); });
      draw();
    });
    document.getElementById("results").addEventListener("pointermove", function (ev) {
      var f = ev.target.closest && ev.target.closest(".feature"); if (!f) return;
      var r = f.getBoundingClientRect();
      f.style.setProperty("--mx", (ev.clientX - r.left) + "px");
      f.style.setProperty("--my", (ev.clientY - r.top) + "px");
    });
    document.getElementById("wikiVault").addEventListener("change",function(ev){state.vault=ev.target.value;draw()});
    document.getElementById("wikiStatus").addEventListener("change",function(ev){state.status=ev.target.value;draw()});
    document.getElementById("q").addEventListener("input", function (ev) {
      state.q = ev.target.value.trim().toLowerCase(); draw();
    });

    var q = DATA.queue || [];
    var queueEl = document.getElementById("queue");
    if (q.length) {
      queueEl.innerHTML =
        "<h2>В очереди</h2><p>Эти записи ещё не написаны. Они появятся в каталоге по мере готовности.</p><ul>" +
        q.map(function (i) {
          return "<li><span>" + esc(i.name) + '</span><span class="q-cat">' + esc(catName(i.category)) + "</span></li>";
        }).join("") + "</ul>";
    } else { queueEl.hidden = true; }

    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Страница записи ---------- */
  function renderEntry(e) {
    document.title = e.name + " — Вики VAULT ZERO";
    var hasArt = !!e.image;
    var facts = (e.facts || []).map(function (f) {
      return "<div><dt>" + esc(f[0]) + "</dt><dd>" + esc(f[1]) + "</dd></div>";
    }).join("");

    var html =
      '<section class="e-hero' + (hasArt ? "" : " no-art") + '" id="hero">' +
        ringsSvg() +
        '<canvas id="fx" aria-hidden="true"></canvas>' +
        '<div class="wrap e-stage">' +
          titleHtml(e.name) +
          (hasArt ? '<div class="e-art" id="art"><div class="art-in" style="--img:url(\'' + esc(e.image) + '\')"><img src="' + esc(e.image) + '" alt="' + esc(e.name) + '"><span class="lit" aria-hidden="true"></span></div></div>' : "") +
          '<div class="e-meta">' +
            '<p class="crumb"><a href="#/">Вики</a> / ' + esc(catName(e.category)) + "</p>" +
            '<p class="e-tag">' + esc(e.tagline) + "</p>" +
            (facts ? '<dl class="facts">' + facts + "</dl>" : "") +
            (e.vault ? '<p class="entry-vault-link"><a href="vaults.html#'+esc(e.vault)+'">↗ Коллекция '+esc(window.VZ_VAULTS.find(function(v){return v.id===e.vault}).name)+'</a></p>' : '') +
          "</div>" +
        "</div>" +
      "</section>" +
      '<div class="wrap">';

    if (e.description && e.description.length) {
      html += '<section class="e-sec"><h2>Описание</h2><div class="prose">' +
        e.description.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div></section>";
    }

    if (hasArt && e.parts && e.parts.length) {
      html += '<section class="e-sec"><h2>Устройство</h2><div class="anat">' +
        '<div class="anat-img"><div class="anat-view"><div class="zoom" id="zoom"><img src="' + esc(e.image) + '" alt="Схема: ' + esc(e.name) + '">' +
        e.parts.map(function (p, i) {
          return '<button class="hot" type="button" data-i="' + i + '" style="left:' + p.x + "%;top:" + p.y + '%" aria-label="' + esc(p.name) + '" aria-pressed="' + (i === 0) + '"></button>';
        }).join("") + '</div><button class="zoom-reset" id="zreset" type="button" hidden>Показать целиком</button></div></div>' +
        '<ul class="parts">' + e.parts.map(function (p, i) {
          return '<li class="part' + (i === 0 ? " on" : "") + '" data-i="' + i + '"><button type="button" aria-expanded="' + (i === 0) + '">' +
            '<span class="p-name">' + esc(p.name) + '</span><span class="p-text">' + esc(p.text) + "</span></button></li>";
        }).join("") + "</ul></div></section>";
    }

    html += '<section class="e-sec"><h2>Характеристики</h2>';
    if (e.stats && e.stats.length) {
      html += '<table class="stat-table"><tbody>' + e.stats.map(function (s) {
        return "<tr><th scope=\"row\">" + esc(s[0]) + "</th><td>" + esc(s[1]) + "</td></tr>";
      }).join("") + "</tbody></table>";
    } else {
      html += '<p class="stat-note">Характеристики ещё не утверждены. Они появятся здесь после настройки баланса.</p>';
    }
    html += "</section>";

    if (e.lore && e.lore.length) {
      html += '<section class="e-sec"><h2>История</h2><div class="prose">' +
        e.lore.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div></section>";
    }

    var rel = (e.related || []).map(byId).filter(Boolean);
    if (rel.length) {
      html += '<section class="e-sec see"><h2>Смотрите также</h2><ul>' + rel.map(function (r) {
        return '<li><a href="#/' + esc(r.id) + '"><span class="s-name">' + esc(r.name) + '</span><span class="s-cat">' + esc(catName(r.category)) + "</span></a></li>";
      }).join("") + "</ul></section>";
    }

    html += '<p class="back"><a class="btn" href="#/">Все записи вики</a></p></div>';
    view.innerHTML = html;
    setAccent(view, e.accent);

    var hero = document.getElementById("hero");
    startHeroLoop(hero, document.getElementById("art"), e.accent);

    var parts = view.querySelectorAll(".part");
    var hots = view.querySelectorAll(".hot");
    var zoomEl = document.getElementById("zoom"), zreset = document.getElementById("zreset");
    var activeI = 0, zoomed = false;

    function mark(i) {
      Array.prototype.forEach.call(parts, function (p) {
        var on = p.getAttribute("data-i") === String(i);
        p.classList.toggle("on", on);
        p.firstChild.setAttribute("aria-expanded", String(on));
      });
      Array.prototype.forEach.call(hots, function (h) { h.setAttribute("aria-pressed", String(h.getAttribute("data-i") === String(i))); });
    }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function zoomTo(i) {
      var p = e.parts[i], k = 2.3;
      zoomEl.style.setProperty("--zs", k);
      zoomEl.style.setProperty("--tx", clamp(50 - p.x * k, 100 - 100 * k, 0) + "%");
      zoomEl.style.setProperty("--ty", clamp(50 - p.y * k, 100 - 100 * k, 0) + "%");
      zoomed = true; zreset.hidden = false;
    }
    function unzoom() {
      zoomEl.style.setProperty("--zs", 1);
      zoomEl.style.setProperty("--tx", "0%");
      zoomEl.style.setProperty("--ty", "0%");
      zoomed = false; zreset.hidden = true;
    }
    function pick(i) {
      i = Number(i);
      if (i === activeI && zoomed) { unzoom(); return; }
      activeI = i; mark(i); zoomTo(i);
    }
    if (zoomEl) {
      Array.prototype.forEach.call(parts, function (p) { p.firstChild.addEventListener("click", function () { pick(p.getAttribute("data-i")); }); });
      Array.prototype.forEach.call(hots, function (h) { h.addEventListener("click", function () { pick(h.getAttribute("data-i")); }); });
      zreset.addEventListener("click", unzoom);
    }

    window.scrollTo(0, 0);
  }

  function renderMissing() {
    stopLoop();
    document.title = "Запись не найдена — Вики VAULT ZERO";
    view.innerHTML = '<section class="wrap c-head"><h1>Нет такой записи</h1><p>Возможно, ссылка устарела или запись ещё не написана.</p><p style="margin-top:24px"><a class="btn" href="#/">Открыть каталог</a></p></section>';
    setAccent(view, "bone");
    window.scrollTo(0, 0);
  }

  function route() {
    var h = location.hash.replace(/^#\/?/, "");
    view.style.removeProperty("--acc"); view.style.removeProperty("--acc-rgb");
    if (!h) return renderCatalog();
    var e = byId(decodeURIComponent(h));
    if (e) renderEntry(e); else renderMissing();
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
<script>
(function(){
  var bar=document.querySelector('.progress-track');
  var scheduled=false;
  function paint(){
    var h=document.documentElement;
    var span=Math.max(1,h.scrollHeight-innerHeight);
    bar.style.width=(100*Math.max(0,Math.min(1,scrollY/span))).toFixed(2)+'%';
    scheduled=false;
  }
  addEventListener('scroll',function(){if(!scheduled){scheduled=true;requestAnimationFrame(paint)}},{passive:true});
  addEventListener('resize',paint,{passive:true});
  addEventListener('hashchange',function(){requestAnimationFrame(paint)});
  paint();
})();</script></body>
</html>
